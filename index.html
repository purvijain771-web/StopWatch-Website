<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Stopwatch Pro</title>

    <link rel="stylesheet"
          href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="stopwatch">

<div class="top-bar">

<div>

<h1>

<i class="fa-solid fa-stopwatch"></i>

Smart Stopwatch Pro

</h1>

<p id="currentDate"></p>

</div>

<div class="top-buttons">

<button id="themeBtn">

<i class="fa-solid fa-moon"></i>

</button>

<button id="fullscreenBtn">

<i class="fa-solid fa-expand"></i>

</button>

</div>

</div>

<div class="clock-box">

<div id="status">

Ready

</div>

<div id="time">

00:00:00.000

</div>

<div id="liveClock">

00:00:00

</div>

</div>

<div class="progress-circle">

<div class="circle">

<div class="inside-circle">

<span id="lapCount">

0

</span>

<p>Laps</p>

</div>

</div>

</div>

<div class="buttons">

<button id="startBtn">

<i class="fa-solid fa-play"></i>

Start

</button>

<button id="pauseBtn">

<i class="fa-solid fa-pause"></i>

Pause

</button>

<button id="lapBtn">

<i class="fa-solid fa-flag"></i>

Lap

</button>

<button id="resetBtn">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>

</div>
<div class="stats">

    <div class="card">

        <h2 id="totalLaps">0</h2>

        <p>Total Laps</p>

    </div>

    <div class="card">

        <h2 id="bestLap">--</h2>

        <p>Best Lap</p>

    </div>

    <div class="card">

        <h2 id="slowLap">--</h2>

        <p>Slowest Lap</p>

    </div>

    <div class="card">

        <h2 id="avgLap">--</h2>

        <p>Average Lap</p>

    </div>

</div>

<div class="action-buttons">

    <button id="exportBtn">

        <i class="fa-solid fa-file-export"></i>

        Export Laps

    </button>

    <button id="clearLaps">

        <i class="fa-solid fa-trash"></i>

        Clear Laps

    </button>

</div>

<div class="lap-section">

    <div class="lap-header">

        <h2>

            <i class="fa-solid fa-list"></i>

            Lap History

        </h2>

    </div>

    <ul id="lapList">

        <div class="empty">

            <i class="fa-regular fa-clock"></i>

            <p>No Laps Recorded Yet</p>

        </div>

    </ul>

</div>

<div id="toast"></div>

<footer>

    <p>

        <i class="fa-solid fa-code"></i>

        Built with HTML • CSS • JavaScript

    </p>

    <p>

        Developed by <strong>Purvi Jain</strong>

    </p>

</footer>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
